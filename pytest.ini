[pytest]
# 只收集本项目的测试。
# ⚠ 必须显式限定：仓库根下有若干**仅供本地调研**的第三方参照源码/解压包
#   （`_ref/`、`.archived/`，均在 .gitignore 中、不入版本库），
#   它们的 test/ 目录会被 pytest 顺着目录树捞进来，
#   然后在 `import coloredlogs` 之类的第三方依赖上报收集错误，
#   把「本项目的测试结果」淹掉。
testpaths = tests
norecursedirs = _ref .archived .git output state cache .venv venv node_modules
